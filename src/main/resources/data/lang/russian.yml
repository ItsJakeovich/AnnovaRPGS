### Сектора
## Сектор 0 - SuruWahare
# forest
s0-forest-msg-0: "{sc}Деревья будто следят за мной..."
s0-forest-msg-1: "{sc}Свет здесь теряется быстрее обычного."
s0-forest-msg-2: "{sc}Воздух густой, как будто он дышит мной."
s0-forest-msg-3: "{sc}Я ощущаю шорохи, но не вижу, кто их издаёт."
s0-forest-msg-4: "{sc}Покой этого леса — ложь."
s0-forest-msg-5: "{sc}Здесь не бывает случайных путников."
s0-forest-msg-6: "{sc}Всё живое будто затаилось."
s0-forest-msg-7: "{sc}Что-то в этом лесу зовёт... но куда?"
s0-forest-msg-8: "{sc}Листва дрожит без ветра."
s0-forest-msg-9: "{sc}В сердце леса скрыта истина. Но не всякая истина — благо."
# Dryad Pedestal
s0-dryad-msg-0: "{sc}Здесь всё по-другому. Спокойнее… но не безопаснее."
s0-dryad-msg-1: "{sc}Листья тихо шелестят, будто шепчут имя..."
s0-dryad-msg-2: "{sc}Ветер ласков, но чуждый. Как будто наблюдает."
s0-dryad-msg-3: "{sc}Я не один в этом лесу."
s0-dryad-msg-4: "{sc}Невидимая рука касается моей души..."
s0-dryad-msg-5: "{sc}Здесь царит тишина, в которой спрятана сила."
s0-dryad-msg-6: "{sc}Что-то внутри говорит: не нарушай покой."
# Meteorite
s0-meteorite-msg-0: "{sc}Поверхность будто дышит. Жар поднимается снизу."
s0-meteorite-msg-1: "{sc}Что-то здесь недавно изменило саму землю."
s0-meteorite-msg-2: "{sc}Запах гари и пепла. Как будто звезда умерла прямо здесь."
s0-meteorite-msg-3: "{sc}Внутри… что-то зовёт. Или шепчет?"
s0-meteorite-msg-4: "{sc}Воздух здесь дрожит. Пульсирует."
s0-meteorite-msg-5: "{sc}Тепло… режущее. Нечеловеческое."
s0-meteorite-msg-6: "{sc}Я не уверен, что это был метеорит…"
s0-meteorite-msg-7: "{sc}Под слоем пепла что-то живёт."
s0-meteorite-msg-8: "{sc}Это не падение. Это вторжение."
# Mines
s0-mines-msg-0: "{sc}Здесь темно... слишком темно. И тихо."
s0-mines-msg-1: "{sc}Кажется, воздух здесь... вибрирует."
s0-mines-msg-2: "{sc}Звуки стали глуше. Будто сам камень их поглощает."
s0-mines-msg-3: "{sc}Шаги эхом отражаются от стен. Но это точно мои шаги?"
s0-mines-msg-4: "{sc}Здесь что-то есть. Я чувствую это."
s0-mines-msg-5: "{sc}Кажется, каждый метр шахт пропитан древней тайной."
s0-mines-msg-6: "{sc}В такие места просто так не заходят..."
s0-mines-msg-7: "{sc}Кажется тут кто-то есть. Даже если никого не видно."
s0-mines-msg-8: "{sc}Камень будто смотрит. Оценивает. Ждёт."
s0-mines-msg-9: "{sc}Чем глубже — тем сильнее ощущение, что ты чужак."
# Oasis
s0-oasis-msg-0: "{sc}Это невероятно, я чувствую себя... Спокойно?.."
s0-oasis-msg-1: "{sc}Не знаю, ощущение, что это место излучает ауру...спокойствия"
s0-oasis-msg-2: "{sc}Удивительно, что в таком сумасбродном мире все же есть местечко спокойствия"
s0-oasis-msg-3: "{sc}Кажется, будто я вернулся(лась) домой — так же спокойно, уютно и тепло"
s0-oasis-msg-4: "{sc}Мне не было настолько спокойно, как в этом месте"
s0-oasis-msg-5: "{sc}Как только я пересёк(ла) пустынную границу, ощущения, что все тревоги и переживания куда-то улетели"
s0-oasis-msg-6: "{sc}Если положить на чашу весов это место и спокойствие — они были бы на одной линии"
s0-oasis-msg-7: "{sc}Ощущение, что сходил(а) с ума все это время, пока не пришёл(шла) сюда"
s0-oasis-msg-8: "{sc}Думаю, сейчас я больше всего хочу полежать на этом песке и расслабиться"
s0-oasis-msg-9: "{sc}Хочу, чтобы время остановилось, хочу подольше насладиться спокойствием этого места"

s0-oasis-fish-0: "{sc}Клёв стал намного лучше!"
s0-oasis-fish-1: "{sc}Ваш день насыщается красками!"
s0-oasis-fish-2: "{sc}Вы чувствуете, как удача улыбается вам."
s0-oasis-fish-3: "{sc}Что-то изменилось... но что?"
s0-oasis-fish-4: "{sc}В воздухе витает ощущение гармонии."
# Swamps
s0-swamps-msg-0: "{sc}Хм, странно. Кажется, тут слишком много паутины."
s0-swamps-msg-1: "{sc}Повсюду скользкая влага и липкая сеть…"
s0-swamps-msg-2: "{sc}Шорох. Тихий, но… он не прекращается."
s0-swamps-msg-3: "{sc}Паучьи лапки оставили следы в грязи."
s0-swamps-msg-4: "{sc}Воздух будто с привкусом гнили."
s0-swamps-msg-5: "{sc}Они где-то рядом. Прячутся в тени камышей."
s0-swamps-msg-6: "{sc}Лес дрожит. А может, это я дрожу?"
s0-swamps-msg-7: "{sc}Кажется, из-под воды кто-то вылезает..."

