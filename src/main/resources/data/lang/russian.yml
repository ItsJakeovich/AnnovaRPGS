## Сектор 0 - SuruWahare
# Dryad Pedestal
s0-dryad-msg-0: "Здесь всё по-другому. Спокойнее… но не безопаснее."
s0-dryad-msg-1: "Листья тихо шелестят, будто шепчут имя..."
s0-dryad-msg-2: "Ветер ласков, но чуждый. Как будто наблюдает."
s0-dryad-msg-3: "Я не один в этом лесу."
s0-dryad-msg-4: "Невидимая рука касается моей души..."
s0-dryad-msg-5: "Здесь царит тишина, в которой спрятана сила."
s0-dryad-msg-6: "Что-то внутри говорит: не нарушай покой."
# Mines
s0-mines-msg-0: "Здесь темно... слишком темно. И тихо."
s0-mines-msg-1: "Кажется, воздух здесь... вибрирует."
s0-mines-msg-2: "Звуки стали глуше. Будто сам камень их поглощает."
s0-mines-msg-3: "Шаги эхом отражаются от стен. Но это точно мои шаги?"
s0-mines-msg-4: "Здесь что-то есть. Я чувствую это."
s0-mines-msg-5: "Кажется, каждый метр шахт пропитан древней тайной."
s0-mines-msg-6: "В такие места просто так не заходят..."
s0-mines-msg-7: "Кажется тут кто-то есть. Даже если никого не видно."
s0-mines-msg-8: "Камень будто смотрит. Оценивает. Ждёт."
s0-mines-msg-9: "Чем глубже — тем сильнее ощущение, что ты чужак."
# forest
s0-forest-msg-0: "Деревья будто следят за мной..."
s0-forest-msg-1: "Свет здесь теряется быстрее обычного."
s0-forest-msg-2: "Воздух густой, как будто он дышит мной."
s0-forest-msg-3: "Я ощущаю шорохи, но не вижу, кто их издаёт."
s0-forest-msg-4: "Покой этого леса — ложь."
s0-forest-msg-5: "Здесь не бывает случайных путников."
s0-forest-msg-6: "Всё живое будто затаилось."
s0-forest-msg-7: "Что-то в этом лесу зовёт... но куда?"
s0-forest-msg-8: "Листва дрожит без ветра."
s0-forest-msg-9: "В сердце леса скрыта истина. Но не всякая истина — благо."
# Oasis
s0-oasis-msg-0: "Это невероятно, я чувствую себя... Спокойно?.."
s0-oasis-msg-1: "Не знаю, ощущение, что это место излучает ауру...спокойствия"
s0-oasis-msg-2: "Удивительно, что в таком сумасбродном мире все же есть местечко спокойствия"
s0-oasis-msg-3: "Кажется, будто я вернулся(лась) домой — так же спокойно, уютно и тепло"
s0-oasis-msg-4: "Мне не было настолько спокойно, как в этом месте"
s0-oasis-msg-5: "Как только я пересёк(ла) пустынную границу, ощущения, что все тревоги и переживания куда-то улетели"
s0-oasis-msg-6: "Если положить на чашу весов это место и спокойствие — они были бы на одной линии"
s0-oasis-msg-7: "Ощущение, что сходил(а) с ума все это время, пока не пришёл(шла) сюда"
s0-oasis-msg-8: "Думаю, сейчас я больше всего хочу полежать на этом песке и расслабиться"

s0-oasis-msg-9: "Хочу, чтобы время остановилось, хочу подольше насладиться спокойствием этого места"
s0-oasis-fish-0: "Клёв стал намного лучше!"
s0-oasis-fish-1: "Ваш день насыщается красками!"
s0-oasis-fish-2: "Вы чувствуете, как удача улыбается вам."
s0-oasis-fish-3: "Что-то изменилось... но что?"
s0-oasis-fish-4: "В воздухе витает ощущение гармонии."
# Swamps
s0-swamps-msg-0: "Хм, странно. Кажется, тут слишком много паутины."
s0-swamps-msg-1: "Повсюду скользкая влага и липкая сеть…"
s0-swamps-msg-2: "Шорох. Тихий, но… он не прекращается."
s0-swamps-msg-3: "Паучьи лапки оставили следы в грязи."
s0-swamps-msg-4: "Воздух будто с привкусом гнили."
s0-swamps-msg-5: "Они где-то рядом. Прячутся в тени камышей."
s0-swamps-msg-6: "Лес дрожит. А может, это я дрожу?"
s0-swamps-msg-7: "Кажется, из-под воды кто-то вылезает..."

